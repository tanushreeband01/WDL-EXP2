<!DOCTYPE html>
<html>
<head>
<title>Settings Panel Website</title>

<!-- External CSS Link -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
⚙ Settings Panel Website
</header>

<nav>
<a href="#">Home</a>
<a href="#">Profile</a>
<a href="#">Settings</a>
<a href="#">Help</a>
</nav>

<div class="main">

<!-- Sidebar -->

<div class="sidebar">
<a href="#account">Account Settings</a>
<a href="#notifications">Notifications</a>
<a href="#privacy">Privacy</a>
<a href="#security">Security</a>
<a href="#appearance">Appearance</a>
</div>

<!-- Content -->

<div class="content">

<div id="account" class="section">
<h2>Account Settings</h2>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter email">

<label>Password</label>
<input type="password" placeholder="Enter password">

<button>Save Changes</button>
</div>

<div id="notifications" class="section">
<h2>Notification Settings</h2>

<label><input type="checkbox"> Email Notifications</label>
<label><input type="checkbox"> SMS Notifications</label>
<label><input type="checkbox"> App Notifications</label>

<button>Save Changes</button>
</div>

<div id="privacy" class="section">
<h2>Privacy Settings</h2>

<label>Profile Visibility</label>
<select>
<option>Public</option>
<option>Private</option>
</select>

<label><input type="checkbox"> Show Email to Others</label>
<label><input type="checkbox"> Allow Search Engines</label>

<button>Save Changes</button>
</div>

<div id="security" class="section">
<h2>Security Settings</h2>

<label>Two Factor Authentication</label>
<select>
<option>Enabled</option>
<option>Disabled</option>
</select>

<label>Login Alerts</label>
<select>
<option>On</option>
<option>Off</option>
</select>

<button>Update Security</button>
</div>

<div id="appearance" class="section">
<h2>Appearance</h2>

<label>Theme</label>
<select>
<option>Light</option>
<option>Dark</option>
</select>

<label>Font Size</label>
<select>
<option>Small</option>
<option>Medium</option>
<option>Large</option>
</select>

<button>Save Appearance</button>
</div>

</div>

</div>

<footer>
© 2026 Settings Panel Website | Web Design Project
</footer>

</body>
</html>
